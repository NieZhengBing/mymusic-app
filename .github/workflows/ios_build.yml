name: iOS Build Test

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get

      - name: 清理旧构建
        run: flutter clean

      # ❌ 删掉了单独的 pod install 步骤

      - name: 打包 iOS（不签名）
        run: flutter build ipa --no-codesign

      - name: 上传 ipa 文件
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/ipa/*.ipa