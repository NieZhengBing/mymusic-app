name: iOS Build Test

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 禁用 Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: 安装依赖
        run: flutter pub get

      - name: 清理旧构建
        run: flutter clean

      - name: 打包 iOS（不签名）
        run: flutter build ios --no-codesign --release   # ← 改成 build ios

      - name: 手动打包成 ipa        # ← 新增：把 .app 打包成 ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ios-build.ipa Payload
          echo "✅ ipa 生成成功"
          ls -lh ios-build.ipa

      - name: 上传 ipa 文件
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios-build.ipa        # ← 直接上传 ipa
          if-no-files-found: error