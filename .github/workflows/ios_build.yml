name: iOS Build Test

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 禁用 Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: 安装依赖
        run: flutter pub get

      - name: 清理旧构建
        run: flutter clean

      - name: 打包 iOS（不签名）
        run: flutter build ipa --no-codesign

      - name: 查找构建产物
        run: |
          echo "=== 查找所有 ipa ==="
          find build/ios/archive -type f 2>/dev/null
          ls -la build/ios/archive/ 2>/dev/null

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/archive/**
          if-no-files-found: error