name: iOS Build Test

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 禁用 Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: 安装依赖
        run: flutter pub get

      - name: 清理旧构建
        run: flutter clean

      - name: 打包 iOS（不签名）
        run: flutter build ipa --no-codesign

      - name: 查找构建产物         # ← 新增
        run: |
          echo "=== build 目录结构 ==="
          find build/ios -type f \( -name "*.ipa" -o -name "*.xcarchive" \) 2>/dev/null
          echo "=== 完整 ios build 目录 ==="
          ls -la build/ios/ 2>/dev/null || echo "目录不存在"

      - name: 上传 ipa 文件
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/**/*.ipa
          if-no-files-found: warn